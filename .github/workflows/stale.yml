name: Stale issues and pull requests

on:
  schedule:
    # Cron is UTC only, so this is 08:30 Pacific during daylight time and 07:30 in winter.
    - cron: '30 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    # Schedules run from the default branch, so this only matters if the default branch is ever changed from main.
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
      # The action keeps its place between runs in the Actions cache, and needs this to replace the old entry.
      actions: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 90
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          # Any comment or update takes the label off again and restarts the clock.
          remove-stale-when-updated: true
          # Work someone has taken on or planned is never closed for being quiet.
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security
          exempt-all-assignees: true
          exempt-all-milestones: true
          exempt-draft-pr: true
          close-issue-reason: not_planned
          delete-branch: false
          stale-issue-message: >
            This issue has had no activity for 90 days, so it has been marked as stale. It will be closed in 14
            days unless there is a new comment. If it still affects you, please comment with the version you are
            running and attach the logs from a recent run (see
            [Reporting Issues](https://github.com/bryceforsm/Windows-ISO-Updater#reporting-issues)).
          close-issue-message: >
            Closed after 14 more days without activity. If this still happens with the latest version, please
            reopen it or open a new issue with the logs from the run.
          stale-pr-message: >
            This pull request has had no activity for 90 days, so it has been marked as stale. It will be closed
            in 14 days unless it is updated or someone comments.
          close-pr-message: >
            Closed after 14 more days without activity. You are welcome to reopen it, or open a new pull request
            from an up-to-date branch.
