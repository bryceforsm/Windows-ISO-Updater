name: Tests

# Pull requests only. The ruleset lets changes reach main through a pull request and nothing else, so a run on
# the merge would repeat the one the pull request already passed. release.yml runs the tests again before
# publishing anything.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'Windows-ISO-Updater.ps1'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes the run still going for the previous one pointless, so that run stops.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The script runs on both Windows PowerShell 5.1 and PowerShell 7, which differ in ways such as what
    # ConvertFrom-Json hands back, so the tests run on each.
    name: test (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: powershell
            exe: powershell.exe
          - shell: pwsh
            exe: pwsh.exe
    # A step's own shell cannot read the matrix, but the job's default can.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each edition has its own module folders, so the modules are installed for the one under test.
      # -SkipPublisherCheck because the Pester 3 that ships with Windows is signed by a different publisher.
      - name: Install test modules
        run: |
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -SkipPublisherCheck -Force
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer and Pester
        run: |
          ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -File .\tools\Invoke-Tests.ps1
          exit $LASTEXITCODE
